# Builds the Remote installation archive (aarch64, Python runtime packed by PyInstaller) when a version tag
# is pushed, and attaches it to a GitHub release (download from the web page).
# Private repository: the archive is also committed to the "build" branch, because a deploy key can fetch
# it there with git but cannot download release assets.
name: "Build & Release"

"on":
  push:
    tags:
      - "v*"

env:
  # Python version of the Unfolded Circle PyInstaller builder image.
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    name: Build archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version and id
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> "$GITHUB_ENV"

      - name: Set up QEMU (the builder image is arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        shell: bash
        run: |
          docker run --rm --platform=linux/arm64 \
            --user="$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --collect-all tzdata --collect-data certifi \
                --name intg-${DRIVER_ID} intg-titan/driver.py"

      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts/bin
          mv dist/intg-${DRIVER_ID}/* artifacts/bin
          mv artifacts/bin/intg-${DRIVER_ID} artifacts/bin/driver
          jq --arg v "$VERSION" '.version = $v' driver.json > artifacts/driver.json
          NAME="uc-intg-${DRIVER_ID}-${VERSION}-aarch64"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          tar czf "/tmp/$NAME.tar.gz" -C artifacts .
          (cd /tmp && sha256sum "$NAME.tar.gz" > "$NAME.sha256")
          ls -lah /tmp/$NAME.*

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "/tmp/${{ env.NAME }}.tar.gz,/tmp/${{ env.NAME }}.sha256"
          tag: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            Archive to install on the Unfolded Circle Remote: `${{ env.NAME }}.tar.gz`
            (web configurator, Integrations, Add new, Install custom).
          draft: false
          # Test builds (version containing "test") are pre-releases, never shown as the latest version.
          prerelease: ${{ contains(env.VERSION, 'test') }}
          makeLatest: ${{ contains(env.VERSION, 'test') && 'false' || 'true' }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true

      - name: Publish to the build branch
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-out
          git rm -rf . -q
          git clean -fdxq
          cp "/tmp/$NAME.tar.gz" "/tmp/$NAME.sha256" .
          git add .
          git commit -q -m "Build $NAME"
          git push -f origin HEAD:build
